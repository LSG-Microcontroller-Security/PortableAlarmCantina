name: GPM Release Revision Lock
on:
  push:
    branches: [main, master, 'release/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gpm-release-revision-lock
  cancel-in-progress: false
jobs:
  record:
    name: Record firmware and library revisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Save immutable revision mapping in this repository
        shell: bash
        run: python3 .gpm/release-lock.py "$GITHUB_REF_NAME" "$GITHUB_SHA"
